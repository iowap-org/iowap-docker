name: Sync Docs with Latest Docker Images

on:
  workflow_run:
    workflows: ["Build Docker Images"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger conditions
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_RUN="false"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SHOULD_RUN="true"
          else
            CONCLUSION="$(jq -r '.workflow_run.conclusion // empty' "$GITHUB_EVENT_PATH")"
            HEAD_BRANCH="$(jq -r '.workflow_run.head_branch // empty' "$GITHUB_EVENT_PATH")"
            if [ "$CONCLUSION" = "success" ] && [ "$HEAD_BRANCH" = "main" ]; then
              SHOULD_RUN="true"
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout iowap-docs
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: iowap-org/iowap-docs
          ref: main
          token: ${{ secrets.IOWAP_DOCS_TOKEN }}
          persist-credentials: false
          path: iowap-docs

      - name: Sync image tags to :latest
        id: sync_tags
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        working-directory: iowap-docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r"ghcr\.io/iowap-org/iowap-(?:node-base|storage|server)"
              r":[A-Za-z0-9_][A-Za-z0-9._-]{0,127}"
          )
          changed = []
          for path in sorted(Path(".").rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              updated = pattern.sub(
                  lambda m: m.group(0).split(":")[0] + ":latest", text
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          if changed:
              print("Updated files:")
              print("\n".join(changed))
          else:
              print("All iowap image references already on :latest.")
          PY

      - name: Validate docker-compose snippets
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        working-directory: iowap-docs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          errors = []
          for md_file in sorted(Path(".").rglob("*.md")):
              content = md_file.read_text(encoding='utf-8')
              blocks = re.findall(r"```(?:yaml|yml)\r?\n(.*?)```", content, flags=re.DOTALL)
              for idx, block in enumerate(blocks, start=1):
                  if 'services:' not in block:
                      continue
                  try:
                      yaml.safe_load(block)
                  except yaml.YAMLError as exc:
                      errors.append(f"{md_file} [block {idx}]: {exc}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("All docker-compose snippets valid.")
          PY

      - name: Commit and push docs update
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        working-directory: iowap-docs
        shell: bash
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.IOWAP_DOCS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_SYNC_TOKEN}" ]; then
            echo "Missing IOWAP_DOCS_TOKEN secret for cross-repository docs sync."
            exit 1
          fi
          if git diff --quiet; then
            echo "No docs changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${DOCS_SYNC_TOKEN}@github.com/iowap-org/iowap-docs.git"
          git add .
          git commit -m "[bot] Sync: Docker images updated"
          git push origin HEAD:main
