# IOWAP — relay server compose.
#
# Default: the relay server on SQLite (DB file in the named volume `relay-data`).
# PostgreSQL: opt in via the `postgres` profile:
#
#   docker compose --profile postgres up -d
#
# and set RELAY_DB_TYPE=postgres + RELAY_PG_DSN in .env.

name: iowap-server

services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # Pin a specific iowap-server tag/commit. Default: main branch.
        IOWAP_SERVER_REF: ${IOWAP_SERVER_REF:-main}
    image: iowap-server:local
    container_name: iowap-server
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      # Master admin seed — pin it in .env so it survives container rebuilds.
      RELAY_MASTER_SEED: ${RELAY_MASTER_SEED:-}
      # Backend selection: sqlite (default) or postgres (--profile postgres).
      RELAY_DB_TYPE: ${RELAY_DB_TYPE:-sqlite}
      RELAY_PG_DSN: ${RELAY_PG_DSN:-}
      # Session secret for signed dashboard cookies. Provide a stable value.
      RELAY_SESSION_SECRET: ${RELAY_SESSION_SECRET:-}
      # Dashboard cookie Secure flag — false over plain http on a LAN/NAS.
      RELAY_SESSION_COOKIE_SECURE: ${RELAY_SESSION_COOKIE_SECURE:-true}
      # TLS: set both cert + key to serve HTTPS. Paths are inside the
      # container; mount the certs via the `certs` volume.
      RELAY_TLS_CERTFILE: ${RELAY_TLS_CERTFILE:-}
      RELAY_TLS_KEYFILE: ${RELAY_TLS_KEYFILE:-}
    volumes:
      # SQLite DB + artifacts + config survive `down` / rebuilds.
      - relay-data:/app/.relay
      # TLS certificates — mount your cert/key directory read-only.
      - ${RELAY_TLS_CERTS_DIR:-./certs}:/certs:ro
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional PostgreSQL backend. Only started with `--profile postgres`.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: iowap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  relay-data:
  postgres-data: